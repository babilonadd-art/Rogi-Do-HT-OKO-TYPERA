name: LIVE OVER — Superbet

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rogi-do-ht-oko-typera
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile LiveOverBot.py
      - name: Testy logiki typowania
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Skan LIVE OVER z Superbet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python LiveOverBot.py
      - name: Zapis bazy typów
        run: |
          if [ -f okotypera_rogi.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add okotypera_rogi.db
            git diff --cached --quiet || git commit -m "Update picks database and sent IDs"
            git pull --rebase --autostash origin main
            git push
          fi
