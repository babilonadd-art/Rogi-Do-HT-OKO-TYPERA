name: GOL W OBU POŁOWACH — PREMATCH

on:
  push:
    paths:
      - 'GoalBothHalvesBot.py'
      - 'tests/test_live_over_bot.py'
      - 'tests/test_goal_both_halves_bot.py'
      - '.github/workflows/Bot.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rogi-do-ht-oko-typera
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ false }} # Wstrzymane: publikuje gole w obu połowach, a repozytorium jest przypisane do kanału rożnych HT.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile GoalBothHalvesBot.py
      - name: Testy logiki typowania
        run: python -m unittest discover -s tests -p "test_goal_both_halves_bot.py"
      - name: Skan PREMATCH — Gol w obu połowach z Superbet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python GoalBothHalvesBot.py
      - name: Zapis bazy typów
        run: |
          if [ -f okotypera_rogi.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- okotypera_rogi.db
            if [ -f reset_live_over_history.flag ]; then git add -- reset_live_over_history.flag; fi
            git diff --cached --quiet || git commit -m "Update LIVE Over history and database"
            git pull --rebase --autostash origin main
            git push
          fi

# Skan rynku Gol w obu połowach przed rozpoczęciem spotkania.
