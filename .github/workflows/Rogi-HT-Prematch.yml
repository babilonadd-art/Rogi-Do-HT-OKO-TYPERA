name: HTFT Odds Anomaly Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Main.py'
      - '.github/workflows/Rogi-HT-Prematch.yml'
      - 'requirements.txt'
  schedule:
    # Przesunięcie poza pełne interwały ogranicza opóźnienia harmonogramu GitHub Actions.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rogi-ht-prematch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile Main.py
      - name: Testy rozpoznawania rynków HT/FT
        run: python -m unittest tests.test_htft_market
      - name: Monitoring anomalii kursów HT/FT przed meczem
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Main.py
      - name: Zapis bazy typów rogów
        run: |
          if [ -f okotypera_ht.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add okotypera_ht.db
            git diff --cached --quiet || git commit -m "Update HTFT odds monitoring snapshots"
            git pull --rebase origin main
            git push
          fi
