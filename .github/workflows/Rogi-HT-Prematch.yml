name: HT/FT — monitoring anomalii kursów

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # co 5 minut; monitoruje zmiany kursów HT/FT

permissions:
  contents: write

concurrency:
  group: rogi-ht-prematch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile Main.py
      - name: Testy logiki HT/FT
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Monitoring anomalii kursów HT/FT
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Main.py
      - name: Zapis historii kursów i limitu dziennego
        run: |
          if [ -f okotypera_ht.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add okotypera_ht.db
            git diff --cached --quiet || git commit -m "Persist HTFT odds monitoring history"
            git pull --rebase origin main
            git push
          fi
