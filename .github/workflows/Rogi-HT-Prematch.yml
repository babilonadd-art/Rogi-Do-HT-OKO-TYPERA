name: HTFT Odds Anomaly Monitor

on:
  workflow_dispatch: # ręczne uruchomienie wyłącznie po ponownym włączeniu przez właściciela

permissions:
  contents: write

concurrency:
  group: rogi-ht-prematch
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile Main.py
      - name: Testy rozpoznawania rynków HT/FT
        run: python tests/test_htft_market.py
      - name: Monitoring anomalii kursów HT/FT przed meczem
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Main.py
