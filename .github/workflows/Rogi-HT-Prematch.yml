name: FT — Over 8.5 rzutów rożnych

on:
  workflow_dispatch:
  push:
    paths:
      - "Main.py"
      - "tests/**"
      - ".github/workflows/Rogi-HT-Prematch.yml"
      - "RESET_FT_PICKS"
  schedule:
    - cron: "*/5 * * * *" # co 5 minut; wyszukuje mecze FT Over 8.5 rożnych

permissions:
  contents: write

concurrency:
  group: rogi-ht-prematch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile Main.py
      - name: Testy logiki typów
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Wyszukiwanie typów FT Over 8.5 rożnych
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Main.py
      - name: Zapis wysłanych typów FT
        run: |
          if [ -f okotypera_ht.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || git commit -m "Persist HTFT odds monitoring history"
            git pull --rebase origin main
            git push
          fi
