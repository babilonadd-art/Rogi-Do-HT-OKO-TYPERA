name: CELNE STRZAŁY FT — MoviOdds / bet365

on:
  workflow_dispatch:
  push:
    paths:
      - "CelneStrzalyFT.py"
      - "tests/**"
      - ".github/workflows/Rogi-HT-Prematch.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rogi-ht-prematch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile CelneStrzalyFT.py
      - name: Skan rynku celnych strzałów FT w MoviOdds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
        run: python CelneStrzalyFT.py
      - name: Zapis historii wysłanych typów
        run: |
          if [ -f celne_strzaly_ft.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add celne_strzaly_ft.db
            git diff --cached --quiet || git commit -m "Persist FT shots picks"
            git pull --rebase origin main
            git push
          fi
