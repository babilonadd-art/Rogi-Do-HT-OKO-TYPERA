name: PREMATCH FT CORNERS — Superbet

on:
  workflow_dispatch:
  push:
    paths:
      - "Main.py"
      - "RogiFTDuble.py"
      - "rogift_graphic.py"
      - "tests/test_rogi_ft_duble.py"
      - "tests/test_rogi_ft_security.py"
      - ".github/workflows/FT-Corners-Prematch.yml"
      - ".github/workflows/Rogi-FT-Duble.yml"
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: rogi-ft-duble
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Kontrola składni
        run: python -m py_compile Main.py RogiFTDuble.py rogift_graphic.py
      - name: Testy strategii rożnych FT
        run: python -m unittest discover -s tests -p "test_rogi_ft_*.py"
      - name: Skan dubli FT i wysyłka oryginalnej grafiki
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-graphics-ft]') && 'replace-graphics' || 'scan' }}
        run: python RogiFTDuble.py
      - name: Zapis historii wysłanych typów
        run: |
          if [ -f rogift_duble.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rogift_duble.db
            git diff --cached --quiet || git commit -m "Persist FT graphic doubles"
            git pull --rebase --autostash origin main
            git push
          fi
