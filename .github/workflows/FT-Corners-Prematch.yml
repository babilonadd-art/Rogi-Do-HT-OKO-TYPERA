name: PREMATCH FT CORNERS — Superbet (manual legacy)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb działania"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - reset-limit
          - replace-graphics

permissions:
  contents: write

# Ten starszy workflow jest wyłącznie ręczny. Automatyczne skanowanie
# i reset limitów obsługuje tylko Rogi-FT-Duble.yml.
concurrency:
  group: rogi-ft-legacy-manual
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Walidacja oryginalnego plakatu użytkownika
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path("Neonowy plakat typsterski Rogi do HT.png")
          if not path.is_file():
              raise SystemExit("BRAK oryginalnego plakatu użytkownika — nie wysyłam grafiki zastępczej.")
          image = Image.open(path)
          image.verify()
          image = Image.open(path)
          if image.width < 700 or image.height < 700 or abs(image.width - image.height) > 5:
              raise SystemExit(f"Plakat musi być kwadratowy min. 700x700; otrzymano {image.size}")
          print(f"Oryginalny plakat poprawny: {image.size}, {image.format}")
          PY
      - name: Kontrola składni i testy
        run: |
          python -m py_compile Main.py RogiFTDuble.py rogift_graphic.py
          python -m unittest discover -s tests -p "test_rogi_ft_*.py"
      - name: Ręczne uruchomienie
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: ${{ inputs.mode }}
        run: python RogiFTDuble.py
      - name: Zapis historii wysłanych typów
        run: |
          if [ -f rogift_duble.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rogift_duble.db
            git diff --cached --quiet || git commit -m "Persist FT graphic doubles"
            git pull --rebase --autostash origin main
            git push
          fi
