name: Superbet PL API Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/superbet_pl_probe.py"
      - ".github/workflows/SuperbetPL-Probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install "requests>=2.31,<3"
      - name: Discover Superbet PL offer endpoints
        run: python tests/superbet_pl_probe.py
