name: Superbet PL API Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install "requests>=2.31,<3"
      - name: Probe public Superbet PL pre-match endpoints
        run: python tests/superbet_pl_probe.py
