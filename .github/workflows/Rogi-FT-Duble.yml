name: ROGI FT — DUBLE PREMATCH

on:
  schedule:
    - cron: "*/5 * * * *" # wyszukiwanie nowych dubli co 5 minut
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb działania"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - repost-pending
          - reset-limit
          - reset-today-and-scan
          - clear-today-and-scan
          - replace-graphics

permissions:
  contents: write

# Scheduled cycles only scan and publish new FT doubles; settlement is manual.
# [publish-ft] Immediate scan after user-requested four-doubles limit change.

concurrency:
  group: rogi-ft-duble
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pobierz najnowszy stan main przed skanem
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r requirements.txt
      - name: Sprawdź oryginalny wycinek byka
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source_path = Path("rogi_ft_bull.jpg")
          if not source_path.is_file():
              raise SystemExit("Brak oryginalnego wycinka byka z grafiki użytkownika.")
          with Image.open(source_path) as source:
              if source.format != "JPEG" or source.width < 100 or source.height < 60:
                  raise SystemExit(f"Nieprawidłowy plik byka: {source.format} {source.size}")
          print("Oryginalny wycinek byka użytkownika jest dostępny.")
          PY
      - name: Kontrola składni i testów
        run: |
          python -m py_compile Main.py RogiFTDuble.py rogift_graphic.py
          python -m unittest discover -s tests -p "test_rogi_ft_*.py"
      - name: Usuń stary plakat z bieżącej wersji repo
        run: |
          git rm -f "Neonowy plakat typsterski Rogi do HT.png" rogi_ft_template_new.png || true
          git add rogi_ft_bull.jpg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git commit -m "Keep only user's original bull crop for FT graphics"
            git push origin HEAD:main
          fi
      - name: Wyszukiwanie i publikacja nowych dubli FT
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLICATION_SIGNING_SECRET: ${{ secrets.PUBLICATION_SIGNING_SECRET }}
          BOT_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' && 'scan' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reset-limit-ft]') && 'reset-limit' || github.event_name == 'push' && contains(github.event.head_commit.message, '[clear-history-ft]') && 'clear-history' || github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-graphics-ft]') && 'replace-graphics' || github.event_name == 'push' && contains(github.event.head_commit.message, '[clear-today-ft]') && 'clear-today-and-scan' || contains(github.event.head_commit.message, '[reset-today-ft]') && 'reset-today-and-scan' || github.event_name == 'push' && contains(github.event.head_commit.message, '[repost-ft]') && 'repost-pending' || github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-ft]') && 'scan' || github.event_name == 'push' && 'scan' || github.event.inputs.mode || 'scan' }}
        run: python RogiFTDuble.py
      - name: Zapis historii dubli
        run: |
          if [ -f rogift_duble.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rogift_duble.db ft_sent_event_ids.json
            git diff --cached --quiet || git commit -m "Persist FT corner doubles"
            git pull --rebase --autostash origin main
            git push
          fi

# Push-triggered scans publish live; diagnostics must be run explicitly with a dedicated dry-run mode.
# Reset dziennego limitu uruchamiany wyłącznie przez commit [reset-today-ft].
