name: ROGI FT — DUBLE PREMATCH

on:
  schedule:
    - cron: "*/5 * * * *" # wyszukiwanie nowych dubli co 5 minut
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb działania"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - repost-pending
          - reset-limit
          - reset-today-and-scan
          - clear-today-and-scan
          - replace-graphics
  push:
    paths:
      - "Main.py"
      - "RogiFTDuble.py"
      - "rogift_graphic.py"
      - "tests/test_rogi_ft_security.py"
      - "requirements.txt"
      - "tests/test_rogi_ft_duble.py"
      - ".github/workflows/Rogi-FT-Duble.yml"

permissions:
  contents: write

# Scheduled cycles only scan and publish new FT doubles; settlement is manual.
# [publish-ft] Immediate scan after user-requested four-doubles limit change.

concurrency:
  group: rogi-ft-duble
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r requirements.txt
      - name: Pobierz i przygotuj nowy szablon z Issue #2
        run: |
          if [ ! -f rogi_ft_template_new.png ]; then
            curl --fail --location --retry 3 "https://github.com/user-attachments/assets/06aff966-7d7d-46f1-a174-d0037bbad350" --output /tmp/rogi-ft-issue-screenshot.png
            python - <<'PY'
          from PIL import Image
          source = Image.open("/tmp/rogi-ft-issue-screenshot.png").convert("RGB")
          if source.size != (720, 1640):
              raise SystemExit(f"Nieoczekiwany rozmiar zrzutu Issue #2: {source.size}")
          poster = source.crop((0, 445, 720, 1196))
          if poster.size != (720, 751):
              raise SystemExit(f"Nieprawidłowy wycinek plakatu: {poster.size}")
          poster.save("rogi_ft_template_new.png", format="PNG", optimize=True)
          PY
          fi
          python - <<'PY'
          from PIL import Image
          image = Image.open("rogi_ft_template_new.png")
          assert image.size == (720, 751), image.size
          print("Nowy szablon FT zweryfikowany:", image.size)
          PY
      - name: Kontrola składni i testów
        run: |
          python -m py_compile Main.py RogiFTDuble.py
          python -m unittest discover -s tests -p "test_rogi_ft_*.py"
      - name: Zapisz nowy plakat i usuń stary szablon z bieżącej wersji repo
        run: |
          git rm -f "Neonowy plakat typsterski Rogi do HT.png" || true
          git add rogi_ft_template_new.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git commit -m "Install clean FT poster template and remove legacy poster"
            git push origin HEAD:main
          fi
      - name: Wyszukiwanie i publikacja nowych dubli FT
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLICATION_SIGNING_SECRET: ${{ secrets.PUBLICATION_SIGNING_SECRET }}
          BOT_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' && 'scan' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reset-limit-ft]') && 'reset-limit' || github.event_name == 'push' && contains(github.event.head_commit.message, '[clear-history-ft]') && 'clear-history' || github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-graphics-ft]') && 'replace-graphics' || github.event_name == 'push' && contains(github.event.head_commit.message, '[clear-today-ft]') && 'clear-today-and-scan' || contains(github.event.head_commit.message, '[reset-today-ft]') && 'reset-today-and-scan' || github.event_name == 'push' && contains(github.event.head_commit.message, '[repost-ft]') && 'repost-pending' || github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-ft]') && 'scan' || github.event_name == 'push' && 'dry-run' || github.event.inputs.mode || 'scan' }}
        run: python RogiFTDuble.py
      - name: Zapis historii dubli
        run: |
          if [ -f rogift_duble.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rogift_duble.db
            git diff --cached --quiet || git commit -m "Persist FT corner doubles"
            git pull --rebase --autostash origin main
            git push
          fi

# Pushes remain dry-run only. Use workflow_dispatch for explicit live scans.
# Reset dziennego limitu uruchamiany wyłącznie przez commit [reset-today-ft].
