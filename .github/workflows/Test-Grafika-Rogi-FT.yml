name: TEST — próbka grafiki ROGI FT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r requirements.txt
      - name: Wygeneruj próbkę grafiki bez wysyłania na Telegram
        run: |
          python - <<'PY'
          from pathlib import Path
          from rogift_graphic import render_coupon_image
          legs = [
              {"home": "America de Cali", "away": "Internacional de Bogota", "line": 9.5, "odds": 1.77},
              {"home": "Meksyk", "away": "Jamajka", "line": 9.5, "odds": 1.90},
          ]
          Path("preview-rogi-ft.png").write_bytes(
              render_coupon_image(legs, 3.363, 50.0).getvalue()
          )
          Path("preview-rogi-ft-settled.png").write_bytes(
              render_coupon_image(legs, 3.363, 50.0, settled=True).getvalue()
          )
          PY
      - name: Zapisz podgląd
        uses: actions/upload-artifact@v4
        with:
          name: preview-rogi-ft
          path: |
            preview-rogi-ft.png
            preview-rogi-ft-settled.png
