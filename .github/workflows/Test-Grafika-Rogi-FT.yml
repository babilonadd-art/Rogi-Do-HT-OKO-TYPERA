name: TEST — próbka grafiki ROGI FT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rogift_graphic.py'
      - 'scripts/send_graphic_sample.py'
      - '.github/workflows/Test-Grafika-Rogi-FT.yml'

permissions:
  contents: read

jobs:
  send-test-graphic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r requirements.txt
      - name: Wyślij próbkę oryginalnej grafiki z prawdziwymi meczami
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_graphic_sample.py
