name: TEST — podpis cyfrowy i QR ROGI FT

on:
  workflow_dispatch:
  push:
    paths:
      - 'Screenshot_20261117-110724.png'
      - 'scripts/rogift_test_graphic.py'
      - 'rogift_graphic.py'
      - 'tests/test_rogi_ft_security.py'
      - '.github/workflows/Test-Grafika-Rogi-FT.yml'

permissions:
  contents: read

jobs:
  send-test-graphic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install "requests>=2.31,<3" "Pillow>=10,<13" "qrcode>=7.4,<9"
      - name: Wyślij testową grafikę ze znakiem wodnym
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLICATION_SIGNING_SECRET: ${{ secrets.PUBLICATION_SIGNING_SECRET }}
        run: python scripts/rogift_test_graphic.py
