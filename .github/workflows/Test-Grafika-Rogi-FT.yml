name: TEST — oryginalna grafika ROGI FT na Telegram

on:
  workflow_dispatch:
  push:
    paths:
      - 'Screenshot_20261117-110724.png'
      - 'scripts/rogift_test_graphic.py'
      - '.github/workflows/Test-Grafika-Rogi-FT.yml'

permissions:
  contents: read

jobs:
  send-test-graphic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja requests
        run: pip install "requests>=2.31,<3"
      - name: Wyślij oryginalny plik PNG bez przerabiania
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/rogift_test_graphic.py
