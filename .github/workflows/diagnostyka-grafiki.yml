name: DIAGNOSTYKA GRAFIKI ROGI FT
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostyka-grafiki.yml'
      - 'rogift_graphic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r requirements.txt
      - name: Render podglądu przed i po rozliczeniu
        run: |
          python - <<'PY'
          from pathlib import Path
          from rogift_graphic import render_coupon_image
          legs = [
              {"home": "America de Cali", "away": "Internacional de Bogota", "line": 10.5, "odds": 1.77},
              {"home": "Meksyk", "away": "Jamajka", "line": 9.5, "odds": 1.90},
          ]
          for filename, settled in [
              ("preview-rogi-ft.png", False),
              ("preview-rogi-ft-settled.png", True),
          ]:
              image = render_coupon_image(legs, 3.363, 50.0, settled=settled)
              Path(filename).write_bytes(image.getvalue())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preview-rogi-ft-clean
          path: |
            preview-rogi-ft.png
            preview-rogi-ft-settled.png
          if-no-files-found: error
