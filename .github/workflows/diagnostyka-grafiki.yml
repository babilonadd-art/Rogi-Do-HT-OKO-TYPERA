name: DIAGNOSTYKA GRAFIKI ROGI FT
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostyka-grafiki.yml'
      - 'rogift_graphic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r requirements.txt
      - name: Render testu — wyłącznie podmiana nazw
        run: |
          python - <<'PY'
          from pathlib import Path
          from rogift_graphic import render_coupon_image
          legs = [
              {"home": "America de Cali", "away": "Internacional de Bogota", "line": 10.5, "odds": 2.00},
              {"home": "Meksyk", "away": "Jamajka", "line": 9.5, "odds": 2.12},
          ]
          image = render_coupon_image(legs, 4.24, 50.0)
          Path("preview-rogi-ft.png").write_bytes(image.getvalue())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preview-rogi-ft
          path: preview-rogi-ft.png
          if-no-files-found: error
