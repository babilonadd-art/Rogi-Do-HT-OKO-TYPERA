name: DIAGNOSTYKA GRAFIKI ROGI FT
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostyka-grafiki.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zachowaj oryginalny szablon bez modyfikacji
        run: |
          cp Screenshot_20261117-110724.png original-template.png
      - uses: actions/upload-artifact@v4
        with:
          name: preview-rogi-ft
          path: original-template.png
          if-no-files-found: error
