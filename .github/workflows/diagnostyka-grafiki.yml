name: DIAGNOSTYKA GRAFIKI ROGI FT
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostyka-grafiki.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r requirements.txt
      - name: Render podglądu bez wysyłania na Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from RogiFTDuble import fetch_candidates, STAKE
          from rogift_graphic import render_coupon_image
          now = datetime.now(ZoneInfo("Europe/Warsaw"))
          candidates = fetch_candidates(now)
          if len(candidates) < 2:
              raise SystemExit(f"Za mało prawdziwych meczów do podglądu: {len(candidates)}")
          legs = candidates[:2]
          odds = round(float(legs[0]["odds"]) * float(legs[1]["odds"]), 3)
          image = render_coupon_image(legs, odds, STAKE, coupon_no=0, watermark_id="PREVIEW")
          Path("preview-rogi-ft.png").write_bytes(image.getvalue())
          print(f"PREVIEW_MATCHES={legs[0]['home']} - {legs[0]['away']} / {legs[1]['home']} - {legs[1]['away']}")
          PY
      - name: Zachowaj oryginalny szablon do kontroli
        run: cp Screenshot_20261117-110724.png original-template.png
      - uses: actions/upload-artifact@v4
        with:
          name: preview-rogi-ft
          path: |
            preview-rogi-ft.png
            original-template.png
          if-no-files-found: error

